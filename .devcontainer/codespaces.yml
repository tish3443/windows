services:
  windows:
    container_name: windows
    image: ghcr.io/dockur/windows
    environment:
      RAM_SIZE: "12G"
      CPU_CORES: "max"
      DISK_SIZE: "max"
      DISK_MINIMUM: "1G"
      AUDIO: "Y"
      GPU: "N"
      VM: "N"
      USERNAME: "What"
      PASSWORD: "What"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 3389:3389/tcp
      - 3389:3389/udp
    volumes:
      - ./windows:/storage
    restart: on-failure
    stop_grace_period: 2m
