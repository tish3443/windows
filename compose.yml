services:
  windows:
    image: dockurr/windows
    container_name: windows
    environment:
      VERSION: "tiny11"
      RAM_SIZE: "14G"
      CPU_CORES: "4"
      DISK_SIZE: "256G"
      AUDIO: "Y"
      VM: "N"
      USERNAME: "bill"
      PASSWORD: "gates"
      DISK2_SIZE: "32G"
      DISK3_SIZE: "64G"
    devices:
      - /dev/kvm
      - /dev/net/tun
      - /dev/sdb:/disk1
      - /dev/sdc1:/disk2
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 3389:3389/tcp
      - 3389:3389/udp
    volumes:
      - ./windows:/storage
      - ./example2:/storage2
      - ./example3:/storage3
    restart: always
    stop_grace_period: 2m
